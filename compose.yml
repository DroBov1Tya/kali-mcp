name: kali-mcp

services:

  gateway:
    build:
      context: ./gateway
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      # Supervisor must stop/reap daemons after they drop their UID.
      - KILL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KILL_SWITCH: ${KILL_SWITCH:-1}
      PROXY_HOST: ${PROXY_HOST:-host.docker.internal}
      PROXY_PORT: ${PROXY_PORT:-7897}
      DNS_UPSTREAM: ${DNS_UPSTREAM:-1.1.1.1}
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  kali:
    container_name: ${KALI_CONTAINER:-kali-mcp}
    build:
      context: ./kali
      dockerfile: Dockerfile
    platform: ${PLATFORM:-linux/arm64}
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Keep root, but deny network administration and raw packet injection.
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
        restart: true
    environment:
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - ${KALI_WORKSPACE:-~/kali-workspace}:/workspace
      - kali-apt-cache:/var/cache/apt
    command: bash

  mcp:
    container_name: kali-mcp-server
    profiles:
      - mcp
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - kali
    ports:
      - "${MCP_PORT:-8172}:8172"
    volumes:
      # Docker socket so the MCP server can docker exec into the kali container
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KALI_CONTAINER: ${KALI_CONTAINER:-kali-mcp}
      KALI_EXEC_TIMEOUT: ${KALI_EXEC_TIMEOUT:-120}
      KALI_PROXY: ${KALI_PROXY:-}
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8172"
      MCP_TRANSPORT: "sse"

volumes:
  kali-apt-cache:
