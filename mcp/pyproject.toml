[project]
name = "kali-shell-mcp"
version = "1.0.0"
description = "MCP server exposing a Kali Linux (arm64) container shell to AI models via docker exec"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
]

[project.scripts]
kali-shell-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.hatch.build.targets.wheel.sources]
"server.py" = "kali_shell_mcp/server.py"
